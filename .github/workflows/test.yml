name: api-test
on: [push, workflow_dispatch]

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 启动 Mock 服务并等待就绪
        run: |
          uvicorn teaching_mock:app --port 8001 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done
      - name: 执行用例
        run: pytest tests/api -v --alluredir=allure-results
      - name: 归档报告（失败时同样保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-${{ matrix.python }}
          path: allure-results 